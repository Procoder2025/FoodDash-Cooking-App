<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const r = size * 0.15;

  // Background
  ctx.fillStyle = '#16a34a';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, r);
  ctx.fill();

  // Inner circle
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.35, 0, Math.PI*2);
  ctx.fill();

  // Fork & spoon icon
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = size * 0.04;
  ctx.lineCap = 'round';

  // Fork
  const fx = size * 0.35;
  const fy1 = size * 0.28;
  const fy2 = size * 0.72;
  ctx.beginPath();
  ctx.moveTo(fx, fy1);
  ctx.lineTo(fx, fy2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(fx - size*0.06, fy1);
  ctx.lineTo(fx - size*0.06, fy1 + size*0.15);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(fx + size*0.06, fy1);
  ctx.lineTo(fx + size*0.06, fy1 + size*0.15);
  ctx.stroke();

  // Spoon
  const sx = size * 0.65;
  ctx.beginPath();
  ctx.moveTo(sx, fy1 + size*0.15);
  ctx.lineTo(sx, fy2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(sx, fy1 + size*0.08, size*0.07, size*0.09, 0, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Text "FD"
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${size * 0.12}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('FoodDash', size/2, size * 0.88);
}

drawIcon(document.getElementById('c192'), 192);
drawIcon(document.getElementById('c512'), 512);

// Download links
document.getElementById('c192').toBlob(b => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'icon-192.png';
  a.textContent = 'Download 192px';
  document.body.appendChild(a);
});
document.getElementById('c512').toBlob(b => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'icon-512.png';
  a.textContent = 'Download 512px';
  document.body.appendChild(a);
});
</script>
</body>
</html>
